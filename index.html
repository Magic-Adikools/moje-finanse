    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCpiWeF3KT6DmoFOu2sYnXJ_zkXc7Poyss",
        authDomain: "finanse-pro.firebaseapp.com",
        projectId: "finanse-pro",
        storageBucket: "finanse-pro.firebasestorage.app",
        messagingSenderId: "1075770103726",
        appId: "1:1075770103726:web:4ac44445fc654657475a3f",
        measurementId: "G-TCX9PMV858"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let lastAction = 0;
    let remoteTimestamp = 0;
    let docRef = null;

    // Google Sign-In
    window.signInWithGoogle = async function() {
        try {
            await signInWithPopup(auth, provider);
        } catch(e) {
            console.error("Błąd logowania Google:", e);
            document.getElementById("login-error").style.display = "block";
        }
    };

    window.signOutGoogle = async function() {
        await signOut(auth);
        docRef = null;
        document.getElementById("login-screen").classList.add("active");
        document.getElementById("app-content").style.display = "none";
        document.getElementById("login-user-info").textContent = "";
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById("login-screen").classList.remove("active");
            document.getElementById("app-content").style.display = "block";
            const name = user.displayName || user.email || "Użytkownik";
            document.getElementById("login-user-info").textContent = name;
            docRef = doc(db, "budzet", user.uid);
            window._docRef = docRef;
            await initialLoad();
            notificationsBootCheck();
        } else {
            document.getElementById("login-screen").classList.add("active");
            document.getElementById("app-content").style.display = "none";
        }
    });

    async function initialLoad() {
        try {
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                const cloud = snap.data();
                window.data = JSON.parse(cloud.dane);
                localStorage.setItem("finanse", cloud.dane);
                remoteTimestamp = cloud.t;
                if (typeof load === "function") load();
            }
        } catch (e) { console.error("Błąd startu:", e); }

        onSnapshot(docRef, (d) => {
            if (!d.exists()) return;
            const cloud = d.data();
            if (cloud.t <= remoteTimestamp) return;
            const isTyping = document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA';
            if (Date.now() - lastAction > 5000 && !isTyping) {
                remoteTimestamp = cloud.t;
                window.data = JSON.parse(cloud.dane);
                localStorage.setItem("finanse", cloud.dane);
                if (typeof load === "function") load();
            }
        });
    }

    window.saveToCloud = async function(dataToSave) {
        if (!docRef) return;
        const now = Date.now();
        lastAction = now;
        remoteTimestamp = now;
        try {
            await setDoc(docRef, {
                dane: JSON.stringify(dataToSave),
                t: now
            });
        } catch (e) { console.error("Błąd zapisu:", e); }
    };

    const activity = () => { lastAction = Date.now(); };
    ['mousedown', 'keydown', 'touchstart'].forEach(e => document.addEventListener(e, activity));
</script>

        .tut-step-dot.done { background: var(--success); }
        #tut-skip { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; padding: 4px 0; }
        .tut-icon { font-size: 2.8em; text-align: center; margin-bottom: 10px; }
        .tut-title { font-size: 1.15em; font-weight: 700; color: var(--text); margin-bottom: 8px; text-align: center; }

        .tut-body strong { color: var(--text); }
        .tut-footer { display: flex; gap: 10px; }
        #tut-back { flex: 0 0 auto; background: var(--btn-action-bg); color: var(--text); border: 1px solid var(--border); padding: 13px 20px; border-radius: 12px; font-size: 14px; cursor: pointer; font-weight: 600; }
        #tut-next { flex: 1; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
        #tut-next:active { opacity: 0.82; }

        /* ── THEME PICKER ── */
        .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .theme-card {
            border-radius: 12px; padding: 10px 6px 8px; cursor: pointer;
            border: 2px solid transparent; text-align: center;
            transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
        }
        .theme-card:hover { transform: scale(1.05); }
        .theme-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
        .theme-swatch {
            width: 100%; height: 26px; border-radius: 6px; margin-bottom: 6px;
            display: flex; overflow: hidden;
        }
        .theme-swatch span { flex: 1; display: block; }
        .theme-card .theme-name { font-size: 11px; font-weight: 700; white-space: nowrap; display: block; }
        .theme-card .theme-emoji { font-size: 16px; display: block; margin-bottom: 2px; }

        /* ── LANGUAGE PICKER ── */
        .lang-grid { display: flex; gap: 10px; }
        .lang-btn {
            flex: 1; padding: 10px 6px; border-radius: 10px; border: 2px solid var(--border);
            background: var(--btn-clone-bg); color: var(--text); cursor: pointer;
            font-size: 13px; font-weight: 600; text-align: center;
            transition: border-color 0.2s, background 0.2s;
        }
        .lang-btn.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
        .lang-btn:hover:not(.selected) { border-color: var(--accent); }

        /* ── PRIVACY MODAL ── */
        #privacy-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center; }

        #privacy-content {

            background: none; border: none; box-shadow: none; padding: 0;

        #privacy-content p { margin: 0 0 8px; }
        #privacy-content ul { margin: 0 0 8px; padding-left: 18px; }

        .privacy-footer { flex-shrink: 0; display: flex; justify-content: flex-end; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
        .btn-privacy-link {

            font-size: 13px; padding: 0; text-decoration: underline; text-align: left;
        }

const LANG_KEY = "app_lang";
let currentLang = localStorage.getItem(LANG_KEY) || "pl";

function t(key) {
    return TRANSLATIONS[currentLang][key] || TRANSLATIONS["pl"][key] || key;
}

function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem(finanse_LANG_KEY, lang);
    applyTranslations();
    // Re-render dynamic parts
    renderMonths();
    renderCalendar();
    load();
}

function applyTranslations() {
    // Update lang buttons
    document.getElementById("lang-pl").classList.toggle("selected", currentLang === "pl");
    document.getElementById("lang-en").classList.toggle("selected", currentLang === "en");
    document.documentElement.lang = currentLang;

    // data-i18n elements (text content)
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.textContent = t(key);
    });

    // data-i18n-placeholder elements
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        const key = el.getAttribute("data-i18n-placeholder");
        el.placeholder = t(key);
    });

    // data-i18n-title elements
    document.querySelectorAll("[data-i18n-title]").forEach(el => {
        const key = el.getAttribute("data-i18n-title");
        el.title = t(key);
    });

    // PIN screen hint
    const pinHint = document.getElementById("pin-default-hint");
    if (pinHint) pinHint.textContent = t("pin_default");

    // PIN screen message (if not an error)
    const pinMsg = document.getElementById("pin-msg");
    if (pinMsg && !pinMsg.classList.contains("error")) {
        pinMsg.textContent = t("pin_enter");
    }
}

function applyTheme(id) {
    THEMES.forEach(t => document.body.classList.remove("theme-" + t.id));
    if (id !== "default") document.body.classList.add("theme-" + id);
    localStorage.setItem(finanse_THEME_KEY, id);
    document.querySelectorAll(".theme-card").forEach(c => {
        c.classList.toggle("selected", c.dataset.theme === id);
    });
}

function buildThemePicker() {
    const grid = document.getElementById("theme-grid");
    const current = getTheme();
    grid.innerHTML = "";
    THEMES.forEach(th => {
        const card = document.createElement("div");
        card.className = "theme-card" + (th.id === current ? " selected" : "");
        card.dataset.theme = th.id;
        card.style.background = th.cardBg;
        card.style.color = th.cardText;
        card.innerHTML = `
            <div class="theme-swatch">
                <span style="background:${th.swatchColors[0]}"></span>
                <span style="background:${th.swatchColors[1]}"></span>
                <span style="background:${th.swatchColors[2]}"></span>
            </div>
            <span class="theme-emoji">${th.emoji}</span>
            <span class="theme-name">${th.name}</span>
        `;
        card.onclick = () => applyTheme(th.id);
        grid.appendChild(card);
    });
}

/* ══════════════════════════════════════════════
   PIN LOGIC
══════════════════════════════════════════════ */
const PIN_KEY         = "app_pin";
const PIN_ENABLED_KEY = "app_pin_enabled";

let pinBuffer = "";
let pinMode = "login";

function getPIN()        { return localStorage.getItem(PIN_KEY) || null; }
function isPINEnabled()  { return localStorage.getItem(PIN_ENABLED_KEY) === "1"; }
function setPINEnabled(v){ localStorage.setItem(finanse_PIN_ENABLED_KEY, v ? "1" : "0"); }
function savePIN(pin)    { localStorage.setItem(finanse_PIN_KEY, pin); }

function showPinScreen(mode) {
    pinMode = mode;
    pinBuffer = "";
    updatePinDots();
    const msg = document.getElementById("pin-msg");
    msg.className = "";
    msg.textContent = mode === "login" ? t("pin_enter") : t("pin_set_new");
    document.getElementById("pin-screen").classList.add("active");
}

function hidePinScreen() {
    document.getElementById("pin-screen").classList.remove("active");
}

function pinKey(digit) {
    if (pinBuffer.length >= 4) return;
    pinBuffer += digit;
    updatePinDots();
    if (pinBuffer.length === 4) setTimeout(handlePinComplete, 120);
}

function pinDel() {
    pinBuffer = pinBuffer.slice(0, -1);
    updatePinDots();
}

function updatePinDots() {
    for (let i = 0; i < 4; i++) {
        document.getElementById("dot-" + i).classList.toggle("filled", i < pinBuffer.length);
    }
}

function handlePinComplete() {
    if (pinMode === "login") {
        if (pinBuffer === getPIN()) {
            hidePinScreen();
        } else {
            pinBuffer = "";
            updatePinDots();
            const msg = document.getElementById("pin-msg");
            msg.textContent = t("pin_wrong");
            msg.className = "error";
            setTimeout(() => { msg.className = ""; msg.textContent = t("pin_enter"); }, 1500);
        }
    }
}

/* Boot: set default PIN 1234 if no PIN exists yet, then check */
function bootPinCheck() {
    if (!getPIN()) {
        savePIN("1234");
        setPINEnabled(true);
    }
    if (isPINEnabled() && getPIN()) {
        showPinScreen("login");
    }
}

/* ══════════════════════════════════════════════
   BACKUP EXPORT / IMPORT
══════════════════════════════════════════════ */
function exportBackup() {
    const backupData = {
        _version: 1,
        _exported: new Date().toISOString(),
        finanse: window.data
    };
    const json = JSON.stringify(backupData, null, 2);
    const blob = new Blob([json], { type: "application/json;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const now = new Date();
    const stamp = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0");
    a.href = url;
    a.download = "finanse_pro_backup_" + stamp + ".json";
    a.click();
    URL.revokeObjectURL(url);
    showBackupMsg(t("backup_export_ok"), "ok");
}

function importBackup(input) {
    const file = input.files[0];
    if (!file) return;
    if (!confirm(t("backup_import_confirm"))) { input.value = ""; return; }
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const parsed = JSON.parse(e.target.result);
            let restored;
            if (parsed._version && parsed.finanse) {
                restored = parsed.finanse;
            } else if (parsed.global !== undefined) {
                // direct data object (legacy)
                restored = parsed;
            } else {
                throw new Error("invalid");
            }
            window.data = restored;
            localStorage.setItem("finanse", JSON.stringify(window.data));
            if (typeof saveToCloud === "function") saveToCloud(window.data);
            if (typeof load === "function") load();
            showBackupMsg(t("backup_import_ok"), "ok");
        } catch(err) {
            showBackupMsg(t("backup_import_err"), "err");
        }
        input.value = "";
    };
    reader.readAsText(file);
}

function showBackupMsg(text, type) {
    const msg = document.getElementById("backup-msg");
    if (!msg) return;
    msg.textContent = text;
    msg.className = "settings-msg " + type;
    setTimeout(() => { msg.textContent = ""; msg.className = "settings-msg"; }, 4000);
}

══════════════════════════════════════════════ */
function openSettings() {
    buildThemePicker();
    applyTranslations();
    const enabled = isPINEnabled() && getPIN();
    document.getElementById("pin-enabled-toggle").checked = !!enabled;
    document.getElementById("pin-change-section").style.display = enabled ? "block" : "none";
    document.getElementById("pin-current").value = "";
    document.getElementById("pin-new").value = "";
    document.getElementById("pin-repeat").value = "";
    const msg = document.getElementById("pin-settings-msg");
    msg.textContent = "";
    msg.className = "settings-msg";
    if (!getPIN()) {
        document.getElementById("pin-current").placeholder = "—";
        document.getElementById("pin-current").disabled = true;
    } else {
        document.getElementById("pin-current").placeholder = t("pin_current");
        document.getElementById("pin-current").disabled = false;
    }
    document.getElementById("settings-modal").classList.add("active");
}

function closeSettings() {
    document.getElementById("settings-modal").classList.remove("active");
}

function togglePinEnabled() {
    const enabled = document.getElementById("pin-enabled-toggle").checked;
    const section = document.getElementById("pin-change-section");
    if (enabled) {
        if (!getPIN()) {
            section.style.display = "block";
            document.getElementById("pin-current").disabled = true;
            document.getElementById("pin-current").placeholder = "—";
            showSettingsMsg(t("pin_set_below"), "ok");
        } else {
            section.style.display = "block";
            setPINEnabled(true);
            showSettingsMsg(t("pin_enabled"), "ok");
        }
    } else {
        setPINEnabled(false);
        section.style.display = "none";
        showSettingsMsg(t("pin_disabled"), "ok");
    }
}

function changePIN() {
    const currentInput = document.getElementById("pin-current").value.trim();
    const newPin       = document.getElementById("pin-new").value.trim();
    const repeatPin    = document.getElementById("pin-repeat").value.trim();

    if (!/^\d{4}$/.test(newPin)) return showSettingsMsg(t("pin_4digits"), "err");
    if (newPin !== repeatPin)    return showSettingsMsg(t("pin_no_match"), "err");

    const existingPin = getPIN();
    if (existingPin && currentInput !== existingPin) return showSettingsMsg(t("pin_wrong_current"), "err");

    savePIN(newPin);
    setPINEnabled(true);
    document.getElementById("pin-enabled-toggle").checked = true;
    document.getElementById("pin-change-section").style.display = "block";
    document.getElementById("pin-current").disabled = false;
    document.getElementById("pin-current").placeholder = t("pin_current");
    document.getElementById("pin-current").value = "";
    document.getElementById("pin-new").value = "";
    document.getElementById("pin-repeat").value = "";
    showSettingsMsg(t("pin_saved"), "ok");
}

function showSettingsMsg(text, type) {
    const msg = document.getElementById("pin-settings-msg");
    msg.textContent = text;
    msg.className = "settings-msg " + type;
}

document.getElementById("settings-modal").addEventListener("click", function(e) {
    if (e.target === this) closeSettings();
});

let now = new Date();
let currentMonth = now.getMonth();
let currentYear = now.getFullYear();
let calMonth = currentMonth;
let calYear = currentYear;

window.data = JSON.parse(localStorage.getItem("finanse")) || { global: { longTerm: [] } };
if(!window.data.global) window.data.global = { longTerm: [] };

function getMonths() { return t("months"); }

function init() { renderMonths(); updateYear(); load(); renderCalendar(); }
function updateYear() { document.getElementById("year").innerText = currentYear; }
function prevYear() { currentYear--; updateYear(); load(); }
function nextYear() { currentYear++; updateYear(); load(); }
function goToToday() { currentMonth = now.getMonth(); currentYear = now.getFullYear(); calMonth = currentMonth; calYear = currentYear; init(); }

function renderMonths() {
    const div = document.getElementById("months");
    div.innerHTML = "";
    getMonths().forEach((m, i) => {
        let d = document.createElement("div");
        d.innerText = m.substring(0,3);
        d.className = "month" + (i === currentMonth ? " active" : "");
        d.onclick = () => { currentMonth = i; calMonth = i; calYear = currentYear; renderMonths(); load(); renderCalendar(); }
        div.appendChild(d);
    });
}

function key() { return currentYear + "-" + currentMonth; }

function save() {
    localStorage.setItem("finanse", JSON.stringify(window.data));
    if (typeof saveToCloud === "function") saveToCloud(window.data);
}

function load() {
    let k = key();
    let d = window.data[k] || { income: [], expense: [], reminders: [], notes: "", vacation: "" };
    document.getElementById("incomeBody").innerHTML = "";
    document.getElementById("expenseBody").innerHTML = "";
    document.getElementById("reminderBody").innerHTML = "";
    document.getElementById("longTermBody").innerHTML = "";
    if(d.income) d.income.forEach(i => addIncome(i));
    if(d.expense) d.expense.forEach(e => addExpense(e));
    if(d.reminders) d.reminders.forEach(r => addReminder(r));
    if(window.data.global && window.data.global.longTerm) window.data.global.longTerm.forEach(lt => addLongTerm(lt));
    document.getElementById("notes").value = d.notes || "";
    document.getElementById("vacation").value = d.vacation || "";
    update();
}

function addIncome(d = {}) {
    let r = document.getElementById("incomeBody").insertRow();
    r.innerHTML = `<td></td><td><input class="inc-name" placeholder="${t('placeholder_name')}" value="${d.name||''}" oninput="update()"><div class="kwota-wrap"><input type="number" class="inc-amount" placeholder="${t('amount')}" value="${d.amount||''}" oninput="update()" style="margin-top:5px"></div></td><td><button class="btn-action" onclick="confirmRemove(this)">&#128465;</button></td>`;
}

function addExpense(d = {}) {
    let r = document.getElementById("expenseBody").insertRow();
    r.className = "exp-row";
    r.innerHTML = `
        <td></td>
        <td class="name-cell">
            <input class="exp-name" placeholder="${t('placeholder_what')}" value="${d.name||''}" oninput="update()" style="font-weight:bold; border:none; background:transparent; padding:2px; color:var(--text);">
            <input class="exp-bank sub-input" placeholder="${t('placeholder_payment_source')}" value="${d.bank||''}" oninput="update()">
            <input type="date" class="exp-date sub-input" value="${d.date||''}" onchange="update()">

function addReminder(d = {}) {
    let r = document.getElementById("reminderBody").insertRow();
    r.innerHTML = `<td></td><td><input class="rem-name" placeholder="${t('placeholder_task')}" value="${d.name||''}" oninput="update()"><input type="date" class="rem-date sub-input" value="${d.date||''}" onchange="update()"></td><td><button class="btn-action" onclick="confirmRemove(this)">&#128465;</button></td>`;
}

function addLongTerm(d = {}) {
    let r = document.getElementById("longTermBody").insertRow();
    r.innerHTML = `<td></td><td><input class="lt-name" placeholder="${t('placeholder_obligation')}" value="${d.name||''}" oninput="update()"><input type="date" class="lt-date sub-input" value="${d.date||''}" onchange="update()"></td><td><div class="kwota-wrap"><input type="number" class="lt-amount" placeholder="${t('amount')}" value="${d.amount||''}" oninput="update()"></div></td><td><button class="btn-action" onclick="confirmRemove(this, true)">&#128465;</button></td>`;

/* ── Delete confirmation modal ── */
let _pendingRemoveBtn = null;

function confirmRemove(btn) {
    _pendingRemoveBtn = btn;
    document.getElementById("confirm-modal").classList.add("active");
}

document.getElementById("confirm-yes").onclick = function() {
    document.getElementById("confirm-modal").classList.remove("active");
    if (_pendingRemoveBtn) { _pendingRemoveBtn.closest("tr").remove(); update(); _pendingRemoveBtn = null; }
};

document.getElementById("confirm-no").onclick = function() {
    document.getElementById("confirm-modal").classList.remove("active");
    _pendingRemoveBtn = null;
};

document.getElementById("confirm-modal").addEventListener("click", function(e) {
    if (e.target === this) { this.classList.remove("active"); _pendingRemoveBtn = null; }
});

function togglePartial(cb) {
    let row = cb.closest("tr");
    row.querySelector(".exp-pamount").style.display = cb.checked ? "block" : "none";
    row.querySelector(".remaining-tag").style.display = cb.checked ? "block" : "none";
    update();
}

function moveRow(btn, dir) {
    const row = btn.closest("tr");
    const sibling = dir === -1 ? row.previousElementSibling : row.nextElementSibling;
    if (sibling) { row.parentNode.insertBefore(dir === -1 ? row : sibling, dir === -1 ? sibling : row); update(); }
}

function update() {
    let k = key();
    if(!window.data[k]) window.data[k] = {};
    window.data[k].income = []; window.data[k].expense = []; window.data[k].reminders = [];
    window.data[k].notes = document.getElementById("notes").value;
    window.data[k].vacation = document.getElementById("vacation").value;
    if(!window.data.global) window.data.global = { longTerm: [] };
    window.data.global.longTerm = [];

    let inc = 0, exp = 0, bankMap = {}, todayStr = new Date().toISOString().split('T')[0];

    document.querySelectorAll("#incomeBody tr").forEach(r => {
        let val = Number(r.querySelector(".inc-amount").value) || 0;
        inc += val; window.data[k].income.push({ name: r.querySelector(".inc-name").value, amount: val });
    });

    document.querySelectorAll("#expenseBody tr").forEach(r => {
        let name = r.querySelector(".exp-name").value, bank = r.querySelector(".exp-bank").value || t("unspecified"), date = r.querySelector(".exp-date").value, amount = Number(r.querySelector(".exp-amount").value) || 0, paid = r.querySelector(".exp-paid").checked, partial = r.querySelector(".exp-partial").checked, pAmount = Number(r.querySelector(".exp-pamount").value) || 0;
        let remaining = amount - pAmount;
        r.querySelector(".remaining-tag").innerText = t("remaining_label") + ": " + (remaining > 0 ? remaining : 0);
        exp += amount;
        if(!bankMap[bank]) bankMap[bank] = 0; bankMap[bank] += amount;
        window.data[k].expense.push({ name, bank, date, amount, paid, partial, partialAmount: pAmount });
        r.classList.remove("paid", "partial", "overdue");
        if (paid) r.classList.add("paid"); else if (partial) r.classList.add("partial"); else if (date && date < todayStr) r.classList.add("overdue");
    });

    document.querySelectorAll("#reminderBody tr").forEach(r => {
        window.data[k].reminders.push({ name: r.querySelector(".rem-name").value, date: r.querySelector(".rem-date").value });
    });

    document.querySelectorAll("#longTermBody tr").forEach(r => {
        window.data.global.longTerm.push({ name: r.querySelector(".lt-name").value, date: r.querySelector(".lt-date").value, amount: Number(r.querySelector(".lt-amount").value) || 0 });
    });

    document.getElementById("sumIncome").innerText = inc.toLocaleString();
    document.getElementById("sumExpense").innerText = exp.toLocaleString();
    document.getElementById("balance").innerText = (inc - exp).toLocaleString();
    renderBanks(bankMap); renumber(); save();
}

function renumber() {
    document.querySelectorAll("tbody").forEach(tbody => {
        [...tbody.rows].forEach((r, i) => { r.cells[0].innerText = i + 1; });
    });
}

function renderBanks(map) {
    let bDiv = document.getElementById("banks"); bDiv.innerHTML = "";
    for (let b in map) {
        if(b !== "") bDiv.innerHTML += `<div style="background:var(--white); color:var(--text); padding:10px; margin-bottom:5px; border-radius:8px; border-left:4px solid var(--accent); display:flex; justify-content:space-between"><span>${b}</span><span>${map[b].toLocaleString()} zł</span></div>`;
    }
}

function changeCalMonth(dir) { calMonth += dir; if (calMonth < 0) { calMonth = 11; calYear--; } else if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }

function renderCalendar() {
    const cal = document.getElementById("mini-calendar");
    const d = new Date(calYear, calMonth, 1);
    const lastDay = new Date(calYear, calMonth + 1, 0).getDate();
    let startDay = d.getDay() === 0 ? 6 : d.getDay() - 1;
    const monthName = getMonths()[calMonth];
    let html = `<div style="display:flex; justify-content:space-between; margin-bottom:10px"><button class="btn-action" onclick="changeCalMonth(-1)">&#9664;</button><b style="color:var(--text)">${monthName} ${calYear}</b><button class="btn-action" onclick="changeCalMonth(1)">&#9654;</button></div><div class="cal-grid">`;
    t("cal_days").forEach(day => html += `<div style="font-weight:bold; color:var(--text-muted)">${day}</div>`);
    for(let i=0; i<startDay; i++) html += `<div></div>`;
    for(let day=1; day<=lastDay; day++) {
        let isToday = (day === now.getDate() && calMonth === now.getMonth() && calYear === now.getFullYear()) ? "today" : "";
        html += `<div class="cal-day ${isToday}">${day}</div>`;
    }
    cal.innerHTML = html + "</div>";
}

/* ── Export PDF ── */
function exportPDF() {
    const k = key();
    const d = window.data[k] || { income: [], expense: [], reminders: [], notes: "", vacation: "" };
    const monthName = getMonths()[currentMonth] + " " + currentYear;
    const inc = d.income.reduce((s, i) => s + (i.amount || 0), 0);
    const exp = d.expense.reduce((s, e) => s + (e.amount || 0), 0);
    const bal = inc - exp;

    let incRows = d.income.map((i, idx) =>
        `<tr><td>${idx+1}</td><td>${i.name || ""}</td><td style="text-align:right">${(i.amount||0).toLocaleString()} zł</td></tr>`
    ).join("") || `<tr><td colspan="3" style="color:#aaa">${t('pdf_no_data')}</td></tr>`;

    let expRows = d.expense.map((e, idx) => {
        let status = e.paid ? t('pdf_paid') : e.partial ? t('pdf_partial') : t('pdf_unpaid');
        let remaining = e.partial ? ` (${t('pdf_rest')}: ${Math.max(0, (e.amount||0) - (e.partialAmount||0)).toLocaleString()} zł)` : "";
        return `<tr><td>${idx+1}</td><td>${e.name||""}<br><small style="color:#999">${e.bank||""} ${e.date ? "· "+e.date : ""}</small></td><td style="text-align:right">${(e.amount||0).toLocaleString()} zł</td><td>${status}${remaining}</td></tr>`;
    }).join("") || `<tr><td colspan="4" style="color:#aaa">${t('pdf_no_data')}</td></tr>`;

    const notesHtml = d.notes ? `<h3>${t('pdf_notes_section')}</h3><p style="white-space:pre-wrap">${d.notes}</p>` : "";
    const vacHtml = d.vacation ? `<h3>${t('pdf_vacation_section')}</h3><p style="white-space:pre-wrap">${d.vacation}</p>` : "";

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>Finanse PRO - ${monthName}</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; color: #333; padding: 30px; max-width: 800px; margin: auto; }
        h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
        h3 { color: #2c3e50; margin-top: 28px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th { background: #2c3e50; color: white; padding: 8px; text-align: left; font-size: 12px; }
        td { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; vertical-align: top; }
        .summary { background: #2c3e50; color: white; padding: 20px; border-radius: 10px; display: flex; gap: 30px; margin-top: 20px; flex-wrap: wrap; }
        .summary div { flex: 1; }
        .summary .val { font-size: 1.4em; font-weight: bold; }
        .balance-val { font-size: 1.8em !important; color: #5dade2 !important; }
        @media print { body { padding: 0; } }
    </style></head><body>
    <h1>Finanse PRO &nbsp;&middot;&nbsp; ${monthName}</h1>
    <div class="summary">
        <div>${t('pdf_income_total')}<br><span class="val">${inc.toLocaleString()} zł</span></div>
        <div>${t('pdf_expense_total')}<br><span class="val">${exp.toLocaleString()} zł</span></div>
        <div>${t('pdf_balance')}<br><span class="val balance-val">${bal.toLocaleString()} zł</span></div>
    </div>
    <h3>${t('pdf_income_section')}</h3>
    <table><thead><tr><th>#</th><th>${t('pdf_col_name')}</th><th>${t('pdf_col_amount')}</th></tr></thead><tbody>${incRows}</tbody></table>
    <h3>${t('pdf_expense_section')}</h3>
    <table><thead><tr><th>#</th><th>${t('pdf_col_desc')}</th><th>${t('pdf_col_amount')}</th><th>${t('pdf_col_status')}</th></tr></thead><tbody>${expRows}</tbody></table>
    ${notesHtml}${vacHtml}
    <p style="margin-top:40px; color:#aaa; font-size:11px">${t('pdf_generated')}: ${new Date().toLocaleString(currentLang === 'pl' ? 'pl-PL' : 'en-GB')}</p>
    <script>window.onload = () => window.print();<\/script>
    </body></html>`;

    const win = window.open("", "_blank");
    win.document.write(html);
    win.document.close();
}

/* ── Export CSV ── */
function exportCSV() {
    const k = key();
    const d = window.data[k] || { income: [], expense: [] };
    const monthName = getMonths()[currentMonth] + " " + currentYear;

    const escape = v => `"${String(v||"").replace(/"/g,'""')}"`;
    let rows = [[t('csv_month'), t('csv_type'), t('csv_name'), t('csv_source'), t('csv_date'), t('csv_amount'), t('csv_status'), t('csv_paid_amount'), t('csv_remaining')]];

    d.income.forEach(i => { rows.push([monthName, t('csv_income'), i.name||"", "", "", i.amount||0, "", "", ""]); });
    d.expense.forEach(e => {
        let status = e.paid ? t('pdf_paid') : e.partial ? t('pdf_partial') : t('pdf_unpaid');
        let remaining = e.partial ? Math.max(0, (e.amount||0) - (e.partialAmount||0)) : "";
        rows.push([monthName, t('csv_expense'), e.name||"", e.bank||"", e.date||"", e.amount||0, status, e.partial ? (e.partialAmount||0) : "", remaining]);
    });

    const csv = "\uFEFF" + rows.map(r => r.map(escape).join(";")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `finanse_${currentYear}_${String(currentMonth+1).padStart(2,"0")}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

function cloneIncome() {
    let nm = currentMonth + 1, ny = currentYear; if (nm > 11) { nm = 0; ny++; }
    if (!window.data[ny + "-" + nm]) window.data[ny + "-" + nm] = { income: [], expense: [], reminders: [], notes: "", vacation: "" };
    window.data[ny + "-" + nm].income = JSON.parse(JSON.stringify(window.data[key()].income));
    save(); alert(t("alert_income_copied"));
}

function cloneExpenses() {
    let nm = currentMonth + 1, ny = currentYear; if (nm > 11) { nm = 0; ny++; }
    if (!window.data[ny + "-" + nm]) window.data[ny + "-" + nm] = { income: [], expense: [], reminders: [], notes: "", vacation: "" };
    window.data[ny + "-" + nm].expense = JSON.parse(JSON.stringify(window.data[key()].expense)).map(e => {
        e.paid = false; e.partial = false;
        if (e.date) { let d = new Date(e.date); d.setMonth(d.getMonth() + 1); e.date = d.toISOString().split('T')[0]; }
        return e;
    });
    save(); alert(t("alert_expenses_copied"));
}

function cloneReminders() {
    let nm = currentMonth + 1, ny = currentYear; if (nm > 11) { nm = 0; ny++; }
    if (!window.data[ny + "-" + nm]) window.data[ny + "-" + nm] = { income: [], expense: [], reminders: [], notes: "", vacation: "" };
    window.data[ny + "-" + nm].reminders = JSON.parse(JSON.stringify(window.data[key()].reminders)).map(r => {
        if (r.date) { let d = new Date(r.date); d.setMonth(d.getMonth() + 1); r.date = d.toISOString().split('T')[0]; }
        return r;
    });
    save(); alert(t("alert_reminders_copied"));
}

function cloneVacation() {
    let nm = currentMonth + 1, ny = currentYear; if (nm > 11) { nm = 0; ny++; }
    if (!window.data[ny + "-" + nm]) window.data[ny + "-" + nm] = { income: [], expense: [], reminders: [], notes: "", vacation: "" };
    window.data[ny + "-" + nm].vacation = document.getElementById("vacation").value;
    save(); alert(t("alert_vacation_copied"));
}

}

function tutorialClose() {
    document.getElementById("tutorial-overlay").classList.remove("active");
    localStorage.setItem(finanse_TUT_KEY, "1");
}

function tutorialNext() {
    const steps = t("tut_steps");
    if (tutStep < steps.length - 1) {
        tutStep++;
        tutorialRender();
    } else {
        tutorialClose();
    }
}

function tutorialPrev() {
    if (tutStep > 0) {
        tutStep--;
        tutorialRender();
    }
}

function tutorialRender() {
    const steps = t("tut_steps");
    const step = steps[tutStep];
    const isLast = tutStep === steps.length - 1;

    document.getElementById("tut-icon").textContent = step.icon;
    document.getElementById("tut-title").textContent = step.title;
    document.getElementById("tut-body").innerHTML = step.body;
    document.getElementById("tut-skip").textContent = t("tut_skip");
    document.getElementById("tut-next").textContent = isLast ? t("tut_finish") : t("tut_next");
    document.getElementById("tut-back").textContent = t("tut_back");
    document.getElementById("tut-back").style.display = tutStep === 0 ? "none" : "block";

    // Dots
    const dotsEl = document.getElementById("tut-dots");
    dotsEl.innerHTML = "";
    steps.forEach((_, i) => {
        const dot = document.createElement("div");
        dot.className = "tut-step-dot" + (i === tutStep ? " active" : i < tutStep ? " done" : "");
        dotsEl.appendChild(dot);
    });
}

function tutorialBootCheck() {
    if (!localStorage.getItem(TUT_KEY)) {
        // Delay slightly so PIN screen renders first (if enabled)
        setTimeout(tutorialStart, 800);
    }
}

/* ══════════════════════════════════════════════
   POWIADOMIENIA LOKALNE
══════════════════════════════════════════════ */
const NOTIF_KEY = "notif_permission";

async function requestNotificationPermission() {
    if (!("Notification" in window)) return false;
    if (Notification.permission === "granted") return true;
    if (Notification.permission === "denied") return false;
    const result = await Notification.requestPermission();
    return result === "granted";
}

function sendNotification(title, body, tag) {
    if (Notification.permission !== "granted") return;
    new Notification(title, {
        body: body,
        icon: "ikona-192.png",
        tag: tag,
        renotify: false
    });
}

function checkNotifications() {
    if (Notification.permission !== "granted") return;
    if (!window.data) return;

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const todayStr = today.toISOString().split('T')[0];
    const tomorrowStr = tomorrow.toISOString().split('T')[0];

    // Sprawdź wszystkie miesiące
    Object.keys(window.data).forEach(k => {
        if (k === "global") return;
        const month = window.data[k];

        // Wydatki — zaległe i jutrzejsze
        if (month.expense) {
            month.expense.forEach((e, i) => {
                if (!e.date || e.paid) return;
                const tag = `exp-${k}-${i}`;
                if (e.date < todayStr) {
                    sendNotification(
                        "💸 Zaległa płatność!",
                        `„${e.name || 'Wydatek'}" — termin minął ${e.date}`,
                        tag
                    );
                } else if (e.date === tomorrowStr) {
                    sendNotification(
                        "⏰ Płatność jutro!",
                        `„${e.name || 'Wydatek'}" — ${e.amount ? e.amount + ' zł' : ''} · termin jutro`,
                        tag
                    );
                }
            });
        }

        // Przypomnienia — zaległe i jutrzejsze
        if (month.reminders) {
            month.reminders.forEach((r, i) => {
                if (!r.date) return;
                const tag = `rem-${k}-${i}`;
                if (r.date < todayStr) {
                    sendNotification(
                        "🔔 Zaległe przypomnienie!",
                        `„${r.name || 'Przypomnienie'}" — termin minął ${r.date}`,
                        tag
                    );
                } else if (r.date === tomorrowStr) {
                    sendNotification(
                        "🔔 Przypomnienie na jutro!",
                        `„${r.name || 'Przypomnienie'}" — termin jutro`,
                        tag
                    );
                }
            });
        }
    });

    // Wydatki długoterminowe
    if (window.data.global && window.data.global.longTerm) {
        window.data.global.longTerm.forEach((lt, i) => {
            if (!lt.date) return;
            const tag = `lt-${i}`;
            if (lt.date < todayStr) {
                sendNotification(
                    "🛡️ Zaległe zobowiązanie!",
                    `„${lt.name || 'Zobowiązanie'}" — termin minął ${lt.date}`,
                    tag
                );
            } else if (lt.date === tomorrowStr) {
                sendNotification(
                    "🛡️ Zobowiązanie jutro!",
                    `„${lt.name || 'Zobowiązanie'}" — termin jutro`,
                    tag
                );
            }
        });
    }
}

async function notificationsBootCheck() {
    if (!("Notification" in window)) return;
    // Jeśli już mamy zgodę — od razu sprawdź
    if (Notification.permission === "granted") {
        setTimeout(checkNotifications, 2000);
        return;
    }
    // Jeśli nie pytaliśmy jeszcze — zapytaj po 3 sek od zalogowania
    if (Notification.permission === "default" && !localStorage.getItem(NOTIF_KEY)) {
        setTimeout(async () => {
            const granted = await requestNotificationPermission();
            localStorage.setItem(finanse_NOTIF_KEY, granted ? "granted" : "denied");
            if (granted) checkNotifications();
        }, 3000);
    }
}

applyTheme(getTheme());
applyTranslations();
init();
bootPinCheck();
tutorialBootCheck();
